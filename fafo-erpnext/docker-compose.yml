version: "3.7"

# ERPNext v15 + Agriculture + Farm HR + Precision Ag + MCP for Umbrel.
#
# Uses the classic Umbrel community-app pattern:
#   app_proxy  → routes public requests to the server container
#   erpnext-db → MariaDB 10.6 sidecar (persistence, upgrade separately)
#   server     → single polehntim/erpnext-umbrel:15 image containing
#                all Frappe processes managed by supervisord (backend,
#                frontend/nginx, websocket, workers, scheduler, redis)
#
# This shape matches what BucketLog and Bank Bridge use and what
# Umbrel's community-app compose merger reliably accepts.
#
# v15.1.0: renamed sidecar `db` → `erpnext-db` for parity with
# `bankbridge-db` and `bucketlog-db`. When multiple community apps
# each named their postgres/mariadb sidecar plainly `db`, the shared
# Umbrel Docker network ended up with three conflicting `db` DNS
# aliases. App-prefixed names eliminate the collision. The host
# bind-mount path `${APP_DATA_DIR}/db` is preserved so existing
# MariaDB data survives the rename in place.
#
# Baked into the image (see fafo-erpnext/build/Dockerfile):
#   * frappe/agriculture       — Crop, Land Unit, Crop Cycle DocTypes
#   * frappe/hrms              — Employee, Payroll, Leave, Attendance
#   * polehntim/farm_i9        — US I-9/W-4 compliance (workspace: Farm HR)
#   * polehntim/farm_precision_ag — USDA pricing, Land/Blocks/Spray/IPM
#   * polehntim/erpnext_mcp    — MCP server for AI-agent access (inert until
#                                token generated at /app/erpnext-mcp-settings)
#
# First boot takes 5-10 minutes while the server container's
# `entrypoint.sh` creates the site + installs erpnext + reconciles
# every baked-in app. Watch: `docker logs -f fafo-erpnext_server_1`.

services:
  app_proxy:
    environment:
      APP_HOST: fafo-erpnext_server_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  erpnext-db:
    image: mariadb:10.6
    restart: on-failure
    stop_grace_period: 1m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: "${APP_SEED}"
    volumes:
      # Host path kept as ${APP_DATA_DIR}/db (unchanged) so the
      # rename doesn't create a fresh empty volume — existing data
      # continues to live at ~/umbrel/app-data/fafo-erpnext/db.
      - ${APP_DATA_DIR}/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-uroot", "-p${APP_SEED}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  server:
    image: polehntim/erpnext-umbrel:15
    restart: on-failure
    stop_grace_period: 2m
    depends_on:
      erpnext-db:
        condition: service_healthy
    environment:
      SITE_NAME: frontend
      # v15.1.0: use service-name DNS resolution (`erpnext-db`) rather
      # than the fully-qualified container name (`fafo-erpnext_db_1`).
      # Matches Bank Bridge's DATABASE_URL pattern and survives compose
      # project-name changes.
      DB_HOST: erpnext-db
      DB_PORT: "3306"
      DB_ROOT_PASS: "${APP_SEED}"
      ADMIN_PASS: "${APP_PASSWORD}"
    # ── farmops-api (erpnext_mcp v0.18.0) ──────────────────────────
    # THE BIND ADDRESS IS THE WHOLE POINT OF THIS LINE.
    #
    # Umbrel's Tailscale app proxies Funnel traffic to ITS OWN
    # localhost — that is not a preference, it is what tailscaled
    # enforces ("only localhost or 127.0.0.1 proxies are currently
    # supported"; see the long note in fafo-bank-bridge's compose,
    # which hit the same wall and solved it with a shared network
    # namespace). That container shares the HOST network namespace,
    # which is why the existing funnel entry can say
    # `http://127.0.0.1:5300` and reach this app at all: 5300 is the
    # port Umbrel publishes for fafo-erpnext ON THE HOST.
    #
    # So a service listening on 127.0.0.1:5250 *inside this container*
    # is invisible to Funnel — a container's loopback is its own. The
    # port has to exist on the host's loopback, and that is what this
    # publishes.
    #
    # `127.0.0.1:` IS NOT OPTIONAL. Plain `5250:5250` would bind
    # 0.0.0.0 and put the mobile API on the farm LAN, reachable by
    # anything on the network. Pinning the host side to loopback means
    # exactly two things can reach it: processes on the Umbrel itself,
    # and the Tailscale container that shares its namespace. The
    # credential gate, the role gate, the Mobile Access Grant, entity
    # scoping and the rate limit all still run on every call — this is
    # the layer BEFORE any of that, and it costs one prefix.
    ports:
      - "127.0.0.1:5250:5250"
    volumes:
      - ${APP_DATA_DIR}/sites:/home/frappe/frappe-bench/sites
